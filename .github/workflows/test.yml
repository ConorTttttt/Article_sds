name: Verify deterministic SDS rules
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit and boundary regression tests
        run: node --test tests/*.test.mjs
      - name: Browser module syntax
        run: node --check src/app.mjs && node --check src/rules.mjs
